# coordination/nodes.yml — crew node registry
# One row per node. EVERY NODE EDITS ITS OWN ROW ONLY: two nodes touching two different rows
# merge cleanly or conflict as plain text; a node editing someone else's row can silently
# change who owns a lane. Field reference: crew `nodes.md`.

timezone: UTC+8          # how timestamps here and in entries are read

nodes:
  - id: brain            # entry-ID prefix and dispatch address; unique, never reused
    holding: none        # volatile fields first: easiest to read, cleanest diffs
    eta: -                # when the current step is expected to land, or -
    host: <machine>      # a label, not a filesystem path
    agent: claude        # claude | codex | other
    role: brain          # brain | node
    skills: [review, architecture, scheduling]
    lanes: ["coordination/**"]
    branch: <brain-branch>
    decides: [conventions, scope, interfaces between lanes]
    escalates_to: owner  # who answers what this node cannot decide
    reports_to: owner    # the user

  # Delete the example below once real nodes have joined with /crew:node.
  - id: be-codex
    holding: none
    eta: -
    host: workstation-01
    agent: codex
    role: node
    skills: [java, spring, mysql]
    lanes: ["backend/**", "deploy/**"]
    branch: codex/backend
    decides: [internal design within its lanes, test strategy]
    escalates_to: owner  # NOT necessarily reports_to -- write it even when identical
    reports_to: brain
